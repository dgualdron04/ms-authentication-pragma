server:
  port: 8080
spring:
  application:
    name: "ms-autentication"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: crediya_db
    schema: public
    username: crediya
    password: crediya2025
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  paths:
    users: "/api/v1/usuarios"
    usersById: "/api/v1/usuarios/{id}"
