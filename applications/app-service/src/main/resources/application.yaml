server:
  port: 8080
spring:
  application:
    name: "ms-autentication"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
logging:
  level:
    root: INFO # PROD - INFO
    co.com.pragma: DEBUG # PROD - INFO/DEBUG
    org.springframework.r2dbc: WARN
    io.r2dbc.postgresql.QUERY: INFO # PROD - INFO O WARN
    io.r2dbc.postgresql.PARAM: WARN # PROD - WARM O OFF
adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: crediya_db
    schema: public
    username: crediya
    password: crediya2025
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
routes:
  paths:
    users: "/api/v1/usuarios"
    usersById: "/api/v1/usuarios/{id}"
    existsByEmail: "/api/v1/usuarios/email/{email}"
    existsByIdNumber: "/api/v1/usuarios/idNumber/{idNumber}"
    login: "/api/v1/login"
    hello: "/hello"
    swagger: "/webjars/swagger-ui/**"
jwt:
  secret: "GKU2sCyjHN2D4KXdLKsxRn3UDKI1TjTdP3pxzMzfIE8="
  expiration: 3600